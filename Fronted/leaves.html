<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMS — Leave Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0f0f0f; --gray-600: #6b6b6b; --gray-400: #a0a0a0;
    --gray-200: #e8e8e8; --gray-100: #f4f4f4; --white: #ffffff;
    --success-bg: #f0faf5; --success-text: #1a7a4a; --success-border: #a8dfc0;
    --error-bg: #fdf2f2; --error-text: #c0392b; --error-border: #f0b8b8;
    --warn-bg: #fffbf0; --warn-text: #b45309; --warn-border: #fcd34d;
    --info-bg: #eff6ff; --info-text: #1d4ed8; --info-border: #bfdbfe;
    --radius: 8px; --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace; --sidebar: 220px;
  }
  html, body { height: 100%; font-family: var(--font); background: var(--gray-100); color: var(--black); -webkit-font-smoothing: antialiased; }
  .layout { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }

  /* Sidebar */
  .sidebar { background: var(--white); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 16px; border-bottom: 1px solid var(--gray-200); }
  .brand-icon { width: 28px; height: 28px; background: var(--black); border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-icon svg { width: 14px; height: 14px; }
  .brand-name { font-size: 13px; font-weight: 500; color: var(--black); }
  .sidebar-nav { padding: 12px 10px; flex: 1; }
  .nav-label { font-size: 10px; font-weight: 500; color: var(--gray-400); letter-spacing: 0.08em; text-transform: uppercase; padding: 0 10px; margin: 16px 0 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; font-size: 13px; color: var(--gray-600); text-decoration: none; transition: background 0.12s, color 0.12s; margin-bottom: 1px; }
  .nav-item:hover { background: var(--gray-100); color: var(--black); }
  .nav-item.active { background: var(--gray-100); color: var(--black); font-weight: 500; }
  .nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.6; }
  .nav-item.active svg { opacity: 1; }
  .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--gray-200); }
  .user-row { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 30px; height: 30px; background: var(--black); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--white); flex-shrink: 0; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 12px; font-weight: 500; color: var(--black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-role-lbl { font-size: 11px; color: var(--gray-400); }
  .logout-btn { background: none; border: none; cursor: pointer; padding: 4px; color: var(--gray-400); transition: color 0.15s; }
  .logout-btn:hover { color: var(--black); }
  .logout-btn svg { width: 14px; height: 14px; display: block; }

  /* Main */
  .main { display: flex; flex-direction: column; }
  .topbar { background: var(--white); border-bottom: 1px solid var(--gray-200); padding: 0 28px; height: 56px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .topbar-title { font-size: 15px; font-weight: 500; }
  .content { padding: 24px 28px; flex: 1; }

  .btn-primary { height: 34px; padding: 0 16px; background: var(--black); color: var(--white); border: none; border-radius: 6px; font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary { height: 34px; padding: 0 14px; background: none; color: var(--gray-600); border: 1px solid var(--gray-200); border-radius: 6px; font-family: var(--font); font-size: 13px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
  .btn-secondary:hover { border-color: var(--black); color: var(--black); }
  .btn-approve { height: 28px; padding: 0 12px; background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); border-radius: 5px; font-family: var(--font); font-size: 12px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
  .btn-approve:hover { opacity: 0.8; }
  .btn-reject { height: 28px; padding: 0 12px; background: var(--error-bg); color: var(--error-text); border: 1px solid var(--error-border); border-radius: 5px; font-family: var(--font); font-size: 12px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
  .btn-reject:hover { opacity: 0.8; }
  .btn-danger { height: 34px; padding: 0 16px; background: var(--error-text); color: var(--white); border: none; border-radius: 6px; font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer; }

  /* Stats */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 16px 18px; }
  .stat-label { font-size: 11px; color: var(--gray-400); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; }
  .stat-value { font-size: 24px; font-weight: 500; font-family: var(--mono); }
  .stat-value.pending  { color: var(--warn-text); }
  .stat-value.approved { color: var(--success-text); }
  .stat-value.rejected { color: var(--error-text); }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--gray-400); pointer-events: none; }
  .search-input { width: 100%; height: 36px; border: 1px solid var(--gray-200); border-radius: 6px; padding: 0 12px 0 34px; font-family: var(--font); font-size: 13px; outline: none; transition: border-color 0.15s; background: var(--white); }
  .search-input:focus { border-color: var(--black); }
  .search-input::placeholder { color: var(--gray-400); }
  .filter-select { height: 36px; border: 1px solid var(--gray-200); border-radius: 6px; padding: 0 10px; font-family: var(--font); font-size: 13px; color: var(--gray-600); background: var(--white); outline: none; cursor: pointer; }
  .filter-select:focus { border-color: var(--black); }

  /* Table */
  .table-wrap { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead { border-bottom: 1px solid var(--gray-200); }
  th { text-align: left; font-size: 11px; font-weight: 500; color: var(--gray-400); letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 16px; background: var(--gray-100); white-space: nowrap; }
  td { padding: 13px 16px; font-size: 13px; border-bottom: 1px solid var(--gray-200); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .emp-name { font-weight: 500; }
  .emp-sub { font-size: 11px; color: var(--gray-400); margin-top: 1px; }
  .actions { display: flex; gap: 6px; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .badge-pending  { background: var(--warn-bg);    color: var(--warn-text); }
  .badge-approved { background: var(--success-bg); color: var(--success-text); }
  .badge-rejected { background: var(--error-bg);   color: var(--error-text); }
  .badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .leave-type { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; background: var(--info-bg); color: var(--info-text); }

  /* Empty */
  .empty { text-align: center; padding: 60px 20px; color: var(--gray-400); }
  .empty svg { width: 36px; height: 36px; margin-bottom: 12px; opacity: 0.3; }
  .empty-title { font-size: 14px; font-weight: 500; color: var(--gray-600); margin-bottom: 4px; }

  /* Modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .overlay.open { display: flex; }
  .modal { background: var(--white); border-radius: 12px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; animation: modalIn 0.2s ease; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(-10px) scale(0.98); } to { opacity: 1; transform: none; } }
  .modal-header { padding: 20px 24px 0; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-title { font-size: 16px; font-weight: 500; }
  .modal-close { width: 28px; height: 28px; background: var(--gray-100); border: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .modal-close:hover { background: var(--gray-200); }
  .modal-close svg { width: 14px; height: 14px; }
  .modal-body { padding: 0 24px; }
  .modal-footer { padding: 20px 24px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--gray-200); margin-top: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11px; font-weight: 500; color: var(--gray-600); letter-spacing: 0.04em; text-transform: uppercase; }
  .field input, .field select, .field textarea { border: 1px solid var(--gray-200); border-radius: 6px; padding: 8px 11px; font-family: var(--font); font-size: 13px; color: var(--black); background: var(--white); outline: none; transition: border-color 0.15s; width: 100%; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--black); }
  .field textarea { height: 80px; resize: vertical; }
  .days-preview { font-size: 12px; color: var(--info-text); background: var(--info-bg); border-radius: 6px; padding: 8px 12px; margin-top: 4px; display: none; }
  .days-preview.show { display: block; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 16px; border-radius: var(--radius); font-size: 13px; z-index: 999; opacity: 0; transform: translateY(12px); transition: opacity 0.25s, transform 0.25s; display: flex; align-items: center; gap: 10px; max-width: 320px; border: 1px solid transparent; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: var(--success-bg); color: var(--success-text); border-color: var(--success-border); }
  .toast.error   { background: var(--error-bg);   color: var(--error-text);   border-color: var(--error-border); }
  .toast svg { width: 15px; height: 15px; flex-shrink: 0; }

  body.viewer .admin-only { display: none !important; }
  body:not(.viewer) .viewer-only { display: none !important; }
  @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } .sidebar { display: none; } .stats-row { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1.2" fill="white"/><rect x="8" y="1" width="5" height="5" rx="1.2" fill="white"/><rect x="1" y="8" width="5" height="5" rx="1.2" fill="white"/><rect x="8" y="8" width="5" height="5" rx="1.2" fill="white" opacity="0.3"/></svg>
      </div>
      <span class="brand-name">EMS</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Main</div>
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
        Dashboard
      </a>
      <a href="employees.html" class="nav-item">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="5" r="2.5"/><path d="M1 13c0-2.76 2.24-5 5-5h1M11 10v4M9 12h4"/></svg>
        Employees
      </a>
      <a href="departments.html" class="nav-item admin-only">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="6" width="4" height="8" rx="1"/><rect x="6" y="3" width="4" height="11" rx="1"/><rect x="11" y="1" width="4" height="13" rx="1"/></svg>
        Departments
      </a>
      <a href="leaves.html" class="nav-item active">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 2v2M11 2v2M2 7h12M5 10h2M9 10h2M5 13h2"/></svg>
        Leave Management
      </a>
      <a href="attendance.html" class="nav-item">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
        Attendance
      </a>
      <a href="payroll.html" class="nav-item admin-only">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="14" height="10" rx="2"/><path d="M1 7h14M5 11h2M10 11h1"/></svg>
        Payroll
      </a>
      <div class="nav-label">Reports</div>
      <a href="#" class="nav-item admin-only">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2h7l3 3v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M10 2v4h4M6 9l2 2 2-2M8 11V7"/></svg>
        Export CSV
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-row">
        <div class="avatar" id="avatarInitials">?</div>
        <div class="user-info">
          <div class="user-name" id="userName">Loading...</div>
          <div class="user-role-lbl" id="userRole">—</div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Sign out">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3M11 11l3-3-3-3M14 8H6"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Leave Management</span>
      <button class="btn-primary viewer-only" onclick="openAddModal()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v12M2 8h12"/></svg>
        Apply leave
      </button>
    </div>

    <div class="content">

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Total Requests</div>
          <div class="stat-value" id="statTotal">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending</div>
          <div class="stat-value pending" id="statPending">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Approved</div>
          <div class="stat-value approved" id="statApproved">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Rejected</div>
          <div class="stat-value rejected" id="statRejected">—</div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-wrap">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="4"/><path d="M9.5 9.5L13 13"/></svg>
          <input class="search-input" id="searchInput" type="text" placeholder="Search by employee name...">
        </div>
        <select class="filter-select" id="statusFilter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
        <select class="filter-select" id="typeFilter">
          <option value="">All types</option>
          <option value="Annual Leave">Annual Leave</option>
          <option value="Sick Leave">Sick Leave</option>
          <option value="Emergency Leave">Emergency Leave</option>
          <option value="Unpaid Leave">Unpaid Leave</option>
          <option value="Casual Leave">Casual Leave</option>
        </select>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Employee</th>
              <th>Leave Type</th>
              <th>Duration</th>
              <th>Days</th>
              <th>Reason</th>
              <th>Status</th>
              <th class="admin-only">Actions</th>
            </tr>
          </thead>
          <tbody id="leaveTableBody">
            <tr><td colspan="7" style="text-align:center;padding:48px;color:var(--gray-400);font-size:13px">Loading leave requests...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- Apply Leave Modal -->
<div class="overlay" id="leaveModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Apply Leave</span>
      <button class="modal-close" onclick="closeModal('leaveModal')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field full admin-only">
          <label>Employee</label>
          <select id="fEmployee"><option value="">Select employee</option></select>
        </div>
        <div class="field full">
          <label>Leave Type</label>
          <select id="fType">
            <option value="">Select type</option>
            <option value="Annual Leave">Annual Leave</option>
            <option value="Sick Leave">Sick Leave</option>
            <option value="Emergency Leave">Emergency Leave</option>
            <option value="Unpaid Leave">Unpaid Leave</option>
            <option value="Casual Leave">Casual Leave</option>
          </select>
        </div>
        <div class="field">
          <label>Start Date</label>
          <input type="date" id="fStart">
        </div>
        <div class="field">
          <label>End Date</label>
          <input type="date" id="fEnd">
        </div>
        <div class="full">
          <div class="days-preview" id="daysPreview"></div>
        </div>
        <div class="field full">
          <label>Reason <span style="color:var(--gray-400);font-weight:400">(optional)</span></label>
          <textarea id="fReason" placeholder="Brief reason for leave..."></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('leaveModal')">Cancel</button>
      <button class="btn-primary" id="saveLeaveBtn" onclick="saveLeave()">
        <span id="saveLeaveBtnText">Submit request</span>
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <svg id="toastIcon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"></svg>
  <span id="toastMsg"></span>
</div>

<script>
  const API_BASE = 'http://localhost:3000/api';
  const token    = localStorage.getItem('ems_token');
  const role     = localStorage.getItem('ems_role') || 'viewer';

  if (!token) window.location.href = 'login.html';
  if (role === 'viewer') document.body.classList.add('viewer');

  const userObj = JSON.parse(localStorage.getItem('ems_user') || '{}');
  const uEmail  = userObj.email || '';
  document.getElementById('avatarInitials').textContent = uEmail.slice(0,2).toUpperCase();
  document.getElementById('userName').textContent = uEmail;
  document.getElementById('userRole').textContent = role.charAt(0).toUpperCase() + role.slice(1);

  let leaves    = [];
  let employees = [];

  /* ── Toast ── */
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toastIcon').innerHTML = type === 'success'
      ? '<path d="M2 8l4 4 8-8"/>'
      : '<path d="M3 3l10 10M13 3L3 13"/>';
    t.className = 'toast ' + type;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  /* ── API helper ── */
  async function apiFetch(path, opts = {}) {
    const res = await fetch(`${API_BASE}${path}`, {
      ...opts,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) }
    });
    if (res.status === 401) { logout(); return null; }
    return res;
  }

  /* ── Load data ── */
  async function loadAll() {
    const [lRes, eRes, sRes] = await Promise.all([
      apiFetch('/leaves'),
      apiFetch('/employees'),
      apiFetch('/leaves/stats')
    ]);
    if (!lRes || !eRes) return;

    const lJson = await lRes.json();
    const eJson = await eRes.json();
    const sJson = sRes ? await sRes.json() : null;

    leaves    = lJson.data    || [];
    employees = eJson.data    || [];

    if (sJson?.data) {
      document.getElementById('statTotal').textContent    = sJson.data.total;
      document.getElementById('statPending').textContent  = sJson.data.pending;
      document.getElementById('statApproved').textContent = sJson.data.approved;
      document.getElementById('statRejected').textContent = sJson.data.rejected;
    }

    // Populate employee dropdown
    const sel = document.getElementById('fEmployee');
    sel.innerHTML = '<option value="">Select employee</option>';
    employees.filter(e => e.status === 'active').forEach(e => {
      sel.insertAdjacentHTML('beforeend', `<option value="${e.id}">${esc(e.full_name)} — ${esc(e.department_name || 'No Dept')}</option>`);
    });

    renderTable(leaves);
  }

  /* ── Render table ── */
  function renderTable(data) {
    const tbody = document.getElementById('leaveTableBody');
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <div class="empty-title">No leave requests found</div>
      </div></td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(l => {
      const start    = new Date(l.start_date).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
      const end      = new Date(l.end_date).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
      const isPending = l.status === 'pending';

      return `<tr>
        <td>
          <div class="emp-name">${esc(l.full_name)}</div>
          <div class="emp-sub">${esc(l.department_name || '—')}</div>
        </td>
        <td><span class="leave-type">${esc(l.leave_type)}</span></td>
        <td style="font-size:12px">${start}<br><span style="color:var(--gray-400)">to ${end}</span></td>
        <td style="font-family:var(--mono);font-size:13px">${l.days ?? '—'}d</td>
        <td style="color:var(--gray-600);font-size:12px;max-width:160px">${esc(l.reason || '—')}</td>
        <td><span class="badge badge-${l.status}"><span class="badge-dot"></span>${l.status}</span></td>
        <td class="admin-only">
          <div class="actions">
            ${isPending ? `
              <button class="btn-approve" onclick="reviewLeave(${l.id},'approve')">Approve</button>
              <button class="btn-reject"  onclick="reviewLeave(${l.id},'reject')">Reject</button>
            ` : `<span style="font-size:11px;color:var(--gray-400)">Reviewed</span>`}
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  /* ── Filters ── */
  function applyFilters() {
    const q      = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const type   = document.getElementById('typeFilter').value;
    const filtered = leaves.filter(l => {
      const matchQ = !q || l.full_name?.toLowerCase().includes(q);
      const matchS = !status || l.status === status;
      const matchT = !type   || l.leave_type === type;
      return matchQ && matchS && matchT;
    });
    renderTable(filtered);
  }

  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('statusFilter').addEventListener('change', applyFilters);
  document.getElementById('typeFilter').addEventListener('change', applyFilters);

  /* ── Days preview ── */
  function updateDaysPreview() {
    const s = document.getElementById('fStart').value;
    const e = document.getElementById('fEnd').value;
    const preview = document.getElementById('daysPreview');
    if (s && e) {
      const start = new Date(s), end = new Date(e);
      if (end < start) {
        preview.textContent = 'End date must be after start date';
        preview.classList.add('show');
        return;
      }
      // Count working days (Mon-Fri), same as backend calcDays
      let days = 0;
      const cur = new Date(start);
      while (cur <= end) {
        if (cur.getDay() !== 0 && cur.getDay() !== 6) days++;
        cur.setDate(cur.getDate() + 1);
      }
      preview.textContent = days > 0
        ? `${days} working day${days > 1 ? 's' : ''}`
        : 'No working days in selected range';
      preview.classList.add('show');
    } else {
      preview.classList.remove('show');
    }
  }

  document.getElementById('fStart').addEventListener('change', updateDaysPreview);
  document.getElementById('fEnd').addEventListener('change', updateDaysPreview);

  /* ── Apply leave modal ── */
  function openAddModal() {
    document.getElementById('fEmployee').value = '';
    document.getElementById('fType').value     = '';
    document.getElementById('fStart').value    = '';
    document.getElementById('fEnd').value      = '';
    document.getElementById('fReason').value   = '';
    document.getElementById('daysPreview').classList.remove('show');
    document.getElementById('leaveModal').classList.add('open');
  }

  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  document.querySelectorAll('.overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
  });

  /* ── Save leave ── */
  async function saveLeave() {
    const employee_id = document.getElementById('fEmployee').value;
    const leave_type  = document.getElementById('fType').value;
    const start_date  = document.getElementById('fStart').value;
    const end_date    = document.getElementById('fEnd').value;
    const reason      = document.getElementById('fReason').value.trim();

    if (role === 'admin' && !employee_id) {
      showToast('Please select an employee.', 'error'); return;
    }
    if (!leave_type || !start_date || !end_date) {
      showToast('Please fill in all required fields.', 'error'); return;
    }

    const btn = document.getElementById('saveLeaveBtn');
    btn.disabled = true;
    document.getElementById('saveLeaveBtnText').textContent = 'Submitting...';

    try {
      const res  = await apiFetch('/leaves', {
        method: 'POST',
        body: JSON.stringify({ employee_id, leave_type, start_date, end_date, reason })
      });
      const data = await res.json();

      if (data.status === 'success') {
        showToast('Leave request submitted!', 'success');
        closeModal('leaveModal');
        await loadAll();
      } else {
        showToast(data.message || 'Failed to submit.', 'error');
      }
    } catch {
      showToast('Connection error. Please try again.', 'error');
    } finally {
      btn.disabled = false;
      document.getElementById('saveLeaveBtnText').textContent = 'Submit request';
    }
  }

  /* ── Approve / Reject ── */
  async function reviewLeave(id, action) {
    try {
      const res  = await apiFetch(`/leaves/${id}/${action}`, { method: 'PATCH' });
      const data = await res.json();
      if (data.status === 'success') {
        showToast(action === 'approve' ? 'Leave approved!' : 'Leave rejected.', 'success');
        await loadAll();
      } else {
        showToast(data.message || 'Failed.', 'error');
      }
    } catch {
      showToast('Connection error. Please try again.', 'error');
    }
  }

  function logout() {
    ['ems_token','ems_role','ems_user'].forEach(k => localStorage.removeItem(k));
    window.location.href = 'login.html';
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadAll();
</script>
</body>
</html>
